                                    quickFilter === 'CRITICAL'
                                        ? 'bg-rose-500 text-white font-black shadow-[0_0_12px_rgba(244,63,94,0.35)]'
                                        : 'bg-[#0b1220] border border-slate-800 text-slate-400 hover:text-rose-400'
                                }`}
                            >
                                <AlertCircle className="w-3.5 h-3.5" /> Critical Escalation (&lt;50%)
                            </button>
                        </div>

                        <div className="text-[11px] font-bold text-slate-400 tracking-wider uppercase">
                            SHOWING {filteredData.length} RECORDS (2026-09-{String(activeDay).padStart(2, '0')})
                        </div>
                    </div>

                    <div className="bg-[#0b1220]/90 border border-slate-800/90 rounded-3xl overflow-hidden shadow-2xl">
                        <div className="overflow-x-auto max-h-[62vh] custom-scrollbar">
                            <table className="w-full text-left whitespace-nowrap border-collapse">
                                <thead className="sticky top-0 z-30 bg-[#0c1424] text-[10px] uppercase font-bold tracking-wider text-slate-400 border-b border-slate-800">
                                    <tr>
                                        <th className="px-5 py-4 cursor-pointer hover:text-cyan-400 sticky left-0 z-40 bg-[#0c1424] sticky-col" onClick={() => requestSort('hub')}>
                                            <div className="flex items-center">HUB LOCATION {getSortIcon('hub')}</div>
                                        </th>
                                        <th className="px-4 py-4 text-right cursor-pointer hover:text-cyan-400" onClick={() => requestSort('ofd')}>
                                            <div className="flex items-center justify-end">TOTAL OFD {getSortIcon('ofd')}</div>
                                        </th>
                                        <th className="px-4 py-4 text-center cursor-pointer hover:text-cyan-400" onClick={() => requestSort('velocity')}>
                                            <div className="flex items-center justify-center">VELOCITY PREDICTION {getSortIcon('velocity')}</div>
                                        </th>

                                        {timeSlots.map(slot => (
                                            <React.Fragment key={slot.key}>
                                                <th className="px-3 py-4 text-right cursor-pointer hover:text-cyan-400" onClick={() => requestSort(`ofd${slot.key}`)}>
                                                    <div className="flex items-center justify-end">{slot.label} OFD {getSortIcon(`ofd${slot.key}`)}</div>
                                                </th>
                                                <th className="px-3 py-4 text-right cursor-pointer hover:text-cyan-400" onClick={() => requestSort(`emo${slot.key}`)}>
                                                    <div className="flex items-center justify-end">{slot.label} EMO% {getSortIcon(`emo${slot.key}`)}</div>
                                                </th>
                                            </React.Fragment>
                                        ))}
                                    </tr>
                                </thead>

                                <tbody className="divide-y divide-slate-800/60 text-xs">
                                    {filteredData.length > 0 ? (
                                        filteredData.map(row => {
                                            const isCritical = (parseFloat(row.emo10am) || 0) > 0 && (parseFloat(row.emo10am) || 0) < 50;
                                            const velocity = computeVelocity(row);

                                            return (
                                                <tr
                                                    key={row.id}
                                                    onClick={() => setSelectedHub(row)}
                                                    className={`cyber-row cursor-pointer ${isCritical ? 'critical-glow' : ''}`}
                                                >
                                                    {/* Hub Name Column */}
                                                    <td className="px-5 py-3.5 font-bold text-white sticky left-0 z-10 bg-[#0b1220] sticky-col">
                                                        <div className="flex items-center gap-2">
                                                            {isCritical && <span className="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>}
                                                            <span className="hover:text-cyan-400 transition-colors font-mono-num">{row.hub}</span>
                                                        </div>
                                                    </td>

                                                    {/* Total OFD */}
                                                    <td className="px-4 py-3.5 text-right font-black text-slate-300 font-mono-num">
                                                        {formatNumber(row.ofd)}
                                                    </td>

                                                    {/* Velocity Prediction */}
                                                    <td className="px-4 py-3.5 text-center">
                                                        <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold ${
                                                            velocity === 'Target Met'
                                                                ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
                                                                : velocity === 'On Track'
                                                                ? 'bg-cyan-500/15 text-cyan-400 border border-cyan-500/30'
                                                                : velocity === 'Moderate'
                                                                ? 'bg-amber-500/15 text-amber-400 border border-amber-500/30'
                                                                : velocity === 'High Risk'
                                                                ? 'bg-rose-500/15 text-rose-400 border border-rose-500/30'
                                                                : 'bg-slate-800/60 text-slate-400 border border-slate-700/60'
                                                        }`}>
                                                            {velocity !== '-' && (
                                                                <span className={`w-1.5 h-1.5 rounded-full ${
                                                                    velocity === 'Target Met' ? 'bg-emerald-400' :
                                                                    velocity === 'On Track' ? 'bg-cyan-400' :
                                                                    velocity === 'Moderate' ? 'bg-amber-400' : 'bg-rose-500'
                                                                }`}></span>
                                                            )}
                                                            {velocity}
                                                        </span>
                                                    </td>

                                                    {/* Dynamic Time Slot Columns (7AM to After 4PM) */}
                                                    {timeSlots.map(slot => {
                                                        const slotOfd = row[`ofd${slot.key}`] || 0;
                                                        const slotEmo = row[`emo${slot.key}`] || 0;

                                                        return (
                                                            <React.Fragment key={slot.key}>
                                                                <td className="px-3 py-3.5 text-right text-slate-400 font-mono-num">
                                                                    {slotOfd === 0 ? <span className="text-slate-600">-</span> : formatNumber(slotOfd)}
                                                                </td>
                                                                <td className="px-3 py-3.5 text-right">
                                                                    <span className={`inline-block px-2 py-0.5 rounded-lg text-[10.5px] font-mono-num font-bold ${
                                                                        slotEmo === 0 ? 'text-slate-500 bg-slate-800/40' :
                                                                        slotEmo >= 95 ? 'text-emerald-400 bg-emerald-500/15 border border-emerald-500/30' :
                                                                        slotEmo >= 80 ? 'text-cyan-400 bg-cyan-500/15 border border-cyan-500/30' :
                                                                        slotEmo >= 50 ? 'text-amber-400 bg-amber-500/15 border border-amber-500/30' :
                                                                        'text-rose-400 bg-rose-500/15 border border-rose-500/30'
                                                                    }`}>
                                                                        {formatPercent(slotEmo)}
                                                                    </span>
                                                                </td>
                                                            </React.Fragment>
                                                        );
                                                    })}
                                                </tr>
                                            );
                                        })
                                    ) : (
                                        <tr>
                                            <td colSpan="20" className="px-6 py-20 text-center text-slate-400">
                                                {isFetching ? "Syncing live data from EMO Table..." : "No hub records found for the selected date."}
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HubEMODashboard />);
    </script>
</body>
</html>
